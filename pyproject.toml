[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localizer"
version = "0.0.1"
description = "Belgian real estate listings aggregator (internal tool for Vergo)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "ODILA", email = "info@odila.be" }]
license = { text = "Proprietary" }
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pydantic>=2.9",
    "curl-cffi>=0.7",
    "selectolax>=0.3.21",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
localizer = "localizer.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/localizer"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "C4",   # comprehensions
    "PTH",  # use pathlib
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Mypy — strict on the architectural core, looser elsewhere
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "src/localizer/core",
    "src/localizer/connectors/base.py",
    "src/localizer/connectors/registry.py",
]
warn_unused_configs = true
warn_return_any = true
