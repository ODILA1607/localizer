{# Shared filter sidebar. Caller sets `form_action` (e.g. "/" or "/map"). #}
<aside class="sidebar">
  <form action="{{ form_action }}" method="get">
    <h3>Filters</h3>

    <label>Tekst
      <input type="search" name="text" value="{{ filters.text }}" placeholder="titel of beschrijving">
    </label>

    <label>Gemeente
      <input type="text" name="gemeente" value="{{ filters.gemeente }}" placeholder="bv. Kortrijk">
    </label>

    <label>Postcode
      <input type="number" name="postcode" value="{{ filters.postcode if filters.postcode is not none else '' }}" min="1000" max="9999">
    </label>

    <fieldset>
      <legend>Prijs (€)</legend>
      <input type="number" name="prijs_min" value="{{ filters.prijs_min if filters.prijs_min is not none else '' }}" placeholder="min">
      <input type="number" name="prijs_max" value="{{ filters.prijs_max if filters.prijs_max is not none else '' }}" placeholder="max">
    </fieldset>

    <label>Min. slaapkamers
      <input type="number" name="slaapkamers_min" value="{{ filters.slaapkamers_min if filters.slaapkamers_min is not none else '' }}" min="0">
    </label>

    <label>Min. oppervlakte (m²)
      <input type="number" name="opp_min" value="{{ filters.opp_min if filters.opp_min is not none else '' }}" min="0">
    </label>

    <fieldset>
      <legend>EPC-label</legend>
      {% for v in options.epc %}
        <label class="chip">
          <input type="checkbox" name="epc" value="{{ v }}" {% if v in filters.epc %}checked{% endif %}>
          {{ v }}
        </label>
      {% endfor %}
    </fieldset>

    <fieldset>
      <legend>Type</legend>
      {% for v in options.type %}
        <label class="chip">
          <input type="checkbox" name="type" value="{{ v }}" {% if v in filters.type %}checked{% endif %}>
          {{ v }}
        </label>
      {% endfor %}
    </fieldset>

    <fieldset>
      <legend>Staat</legend>
      {% for v in options.staat %}
        <label class="chip">
          <input type="checkbox" name="staat" value="{{ v }}" {% if v in filters.staat %}checked{% endif %}>
          {{ v }}
        </label>
      {% endfor %}
    </fieldset>

    <fieldset>
      <legend>Bron</legend>
      {% for v in options.bron %}
        <label class="chip">
          <input type="checkbox" name="bron" value="{{ v }}" {% if v in filters.bron %}checked{% endif %}>
          {{ v }}
        </label>
      {% endfor %}
    </fieldset>

    <label class="inline">
      <input type="checkbox" name="verberg_afgewezen" value="true" {% if filters.verberg_afgewezen %}checked{% endif %}>
      Verberg afgewezen
    </label>

    <div class="actions">
      <button type="submit">Toepassen</button>
      <a href="{{ form_action }}" class="reset">Reset</a>
    </div>
  </form>
</aside>
